<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI LearnMate{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="{{ url_for('home') }}">AI LearnMate</a>
      <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('upload') }}">Upload</a>
        <a href="{{ url_for('graph') }}">Learning Guide</a>
        <a href="{{ url_for('topic') }}">Find Topic</a>
        <a href="{{ url_for('quiz') }}">Quiz</a>
      </div>
    </nav>

    <main class="app-shell">
      {% block content %}{% endblock %}
    </main>

    <script>
      function bindLoadingForm(formId) {
        const form = document.getElementById(formId);
        const loader = document.getElementById("loading");

        if (!form || !loader) {
          return;
        }

        const submitButton = form.querySelector("button[type='submit']");

        window.addEventListener("load", () => {
          loader.classList.remove("active");
          if (submitButton) {
            submitButton.disabled = false;
          }
        });

        form.addEventListener("submit", () => {
          loader.classList.add("active");
          if (submitButton) {
            submitButton.disabled = true;
            submitButton.textContent = "Analyzing...";
          }
        });
      }

      bindLoadingForm("upload-form");
      bindLoadingForm("topic-form");
    </script>
  </body>
</html>
