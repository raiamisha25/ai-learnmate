<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI LearnMate{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="{{ url_for('home') }}">AI LearnMate</a>
      <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('upload') }}">Upload</a>
        <a href="{{ url_for('graph') }}">Learning Guide</a>
        <a href="{{ url_for('topic') }}">Find Topic</a>
        <a href="{{ url_for('quiz') }}">Quiz</a>
      </div>
    </nav>

    <main class="app-shell">
      {% block content %}{% endblock %}
    </main>

    <script>
      const uploadForm = document.getElementById("upload-form");
      const loading = document.getElementById("loading");

      if (uploadForm && loading) {
        uploadForm.addEventListener("submit", () => {
          loading.hidden = false;
        });
      }

      const topicForm = document.getElementById("topic-form");
      const topicLoading = document.getElementById("topic-loading");

      if (topicForm && topicLoading) {
        topicForm.addEventListener("submit", () => {
          topicLoading.hidden = false;
        });
      }
    </script>
  </body>
</html>
