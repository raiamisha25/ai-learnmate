<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI LearnMate{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="{{ url_for('home') }}">AI LearnMate</a>
      <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        {% if g.user %}
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('history') }}">History</a>
        {% endif %}
        <a href="{{ url_for('upload') }}">Upload</a>
        <a href="{{ url_for('study_path') }}">Learning Guide</a>
        <a href="{{ url_for('topic') }}">Find Topic</a>
        <a href="{{ url_for('quiz') }}">Quiz</a>
        <a href="{{ url_for('leaderboard_page') }}">Leaderboard</a>
        {% if g.user %}
          <a href="{{ url_for('logout') }}">Logout</a>
        {% else %}
          <a href="{{ url_for('login') }}">Login</a>
        {% endif %}
        <button id="theme-toggle" class="theme-toggle" type="button">Mode</button>
      </div>
    </nav>

    <main class="app-shell">
      {% block content %}{% endblock %}
    </main>

    <script>
      function bindLoadingForm(formId) {
        const form = document.getElementById(formId);
        const loader = document.getElementById("loading");

        if (!form || !loader) {
          return;
        }

        const submitButton = form.querySelector("button[type='submit']");
        const originalButtonText = submitButton ? submitButton.textContent : "";

        window.addEventListener("load", () => {
          loader.classList.remove("active");
          if (submitButton) {
            submitButton.disabled = false;
            submitButton.textContent = originalButtonText;
          }
        });

        form.addEventListener("submit", () => {
          loader.classList.add("active");
          if (submitButton) {
            submitButton.disabled = true;
            submitButton.textContent = "Analyzing...";
          }
        });
      }

      bindLoadingForm("upload-form");
      bindLoadingForm("topic-form");

      const themeToggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("learnmate-theme");

      if (savedTheme === "dark") {
        document.body.classList.add("dark");
      }

      if (themeToggle) {
        themeToggle.addEventListener("click", () => {
          document.body.classList.toggle("dark");
          localStorage.setItem(
            "learnmate-theme",
            document.body.classList.contains("dark") ? "dark" : "light"
          );
        });
      }
    </script>
  </body>
</html>
